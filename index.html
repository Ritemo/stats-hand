<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>Stats Hand HON M-A</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ COULEURS (logo Pays Riolais Handball) ============ */
:root{
  --orange:#FF6D00;
  --orange-soft:#FFE7D4;
  --black:#1C1C1C;
  --black-2:#2B2B2B;
  --bg:#F2F1EF;
  --surface:#FFFFFF;
  --ink:#1C1C1C;
  --muted:#6B6B6B;
  --line:#E0DDD8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --orange-soft:#3A2412; --bg:#121212; --surface:#1E1E1E; --ink:#F2F2F2; --muted:#A3A3A3; --line:#333;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
.num,h1,h2,h3,.seg button,.chip,.tile b,.club-card span{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- En-têtes ---------- */
.top{position:relative;background:var(--black);color:#fff;padding:16px 16px 20px;overflow:hidden}
.top svg.court{position:absolute;right:-70px;top:-40px;width:270px;height:270px;opacity:.35;pointer-events:none}
.bar-top{position:relative;display:flex;align-items:center;gap:10px;min-height:40px}
.bar-top .t{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.home-title{position:relative;margin-top:18px}
.home-title h1{font-size:44px;font-weight:800;font-style:italic;line-height:.95;text-transform:none}
.home-title h1 em{color:var(--orange);font-style:italic}
.home-title p{opacity:.75;font-size:14px;margin-top:6px}
.page-title{font-size:24px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.club-head{position:relative;display:flex;align-items:center;gap:14px;margin-top:14px}
.club-head h1{font-size:30px;font-weight:800;line-height:1.02}
.club-head .sub{font-size:13px;opacity:.7;margin-top:3px}
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:16px;border-radius:10px;overflow:hidden;background:#000}
.board div{background:var(--black-2);padding:10px 12px}
.board .ttl{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;line-height:1.1}
.board .num{font-size:46px;font-weight:700;line-height:1.05;color:var(--orange);font-variant-numeric:tabular-nums}
.board .lbl{font-size:12px;opacity:.7}
.standing{display:flex;gap:14px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:10px;padding:12px 14px;margin-bottom:22px}
.standing .pos{display:flex;flex-direction:column;justify-content:center;padding-right:14px;border-right:1px solid var(--line)}
.standing .pos .num{font-size:46px;font-weight:800;line-height:1;color:var(--orange)}
.standing .pos .l{font-size:12px;color:var(--muted)}
.standing .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.standing .grid .num{font-size:24px;font-weight:700;line-height:1.05}
.standing .grid .l{font-size:12px;color:var(--muted)}
.pts{font-family:"Barlow Condensed",sans-serif}
.minis{position:relative;display:flex;gap:18px;margin-top:12px;font-size:13px;opacity:.95}
.minis b{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;display:block;line-height:1.1}

/* ---------- Logos ---------- */
.logo{border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0;position:relative}
.logo img{width:100%;height:100%;object-fit:contain;padding:9%}
.logo img[src$="pays-riolais-hb.png"]{padding:0}
.logo .mono{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:#fff;background:var(--black-2);width:100%;height:100%;display:grid;place-items:center;border:3px solid var(--orange);border-radius:50%}
.logo.l64{width:64px;height:64px}.logo.l64 .mono{font-size:20px}
.logo.l72{width:72px;height:72px}.logo.l72 .mono{font-size:22px}
.logo.l32{width:32px;height:32px}.logo.l32 .mono{font-size:11px;border-width:2px}

/* ---------- Contenu ---------- */
main{padding:16px 14px 40px;max-width:640px;margin:0 auto}
h2{font-size:23px;font-weight:700;margin:4px 2px 10px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 12px}
.tiles{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:26px}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;width:100%}
.tile svg{width:28px;height:28px;color:var(--orange);flex-shrink:0}
.tile b{font-size:22px;font-weight:700;display:block;line-height:1.1}
.tile span.d{font-size:13px;color:var(--muted)}
.tile .go{margin-left:auto;color:var(--muted);font-size:22px}
.clubs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.club-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;width:100%}
.club-card span{font-size:15px;font-weight:600;line-height:1.1}
.club-card.mine{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--black);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--orange);color:#1C1C1C}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.row.mine{background:var(--orange-soft)}
.rank{width:26px;font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;color:var(--muted);text-align:center;flex-shrink:0}
.rank.p1{color:var(--orange)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--black);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;flex-shrink:0}
.who{flex:1;min-width:0;display:block}
.who .n,.who .c,.meter,.val .num,.val .s{display:block}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .n .ln{text-transform:uppercase;letter-spacing:.3px}
.who .c{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{text-align:right;flex-shrink:0}
.val .num{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.val .s{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--black);border-radius:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .meter i{background:#8A8A8A}}
.row.mine .meter i{background:var(--orange)}

.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rk .num{font-size:26px;font-weight:700;line-height:1.1}
.rk .l{font-size:12px;color:var(--muted)}
.rk.best .num{color:var(--orange)}

.form{display:flex;gap:6px;margin:-4px 0 18px}
.form span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;color:#fff}
.form .V{background:#1E9E5A}.form .N{background:#8A8A8A}.form .D{background:#C8402F}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 8px;margin-bottom:14px}
.chart h3,.sheet .chart h3{font-family:"Barlow Condensed",sans-serif;font-size:18px;line-height:1.2;font-weight:600;margin:0 4px 6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart text{font-family:"Barlow",sans-serif;font-size:10px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.matches .row{padding:9px 14px}
.res{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;flex-shrink:0}
.res.V{background:#1E9E5A}.res.N{background:#8A8A8A}.res.D{background:#C8402F}
.empty,.error{padding:28px 18px;text-align:center;color:var(--muted)}
.error b{display:block;color:var(--orange);margin-bottom:6px}
.stamp{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

/* ---------- Fiche joueur ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;z-index:11;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:26px;font-weight:700;line-height:1.1}
.sheet .c{color:var(--muted);font-size:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .num{font-size:32px;font-weight:700;line-height:1.05}
.stat .l{font-size:13px;color:var(--muted)}

/* ---------- Calendrier, face-à-face, records ---------- */
.h2s{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
.more{display:block;width:100%;text-align:center;padding:11px;margin:4px 0 22px;color:var(--orange);font-weight:600}
.chips{position:relative}
.next{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:12px;padding:12px 14px;margin-bottom:22px}
.nx-top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.nx-top{flex-wrap:wrap}.nx-top b{white-space:nowrap;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:18px}
.tag{margin-left:auto;background:var(--orange-soft);color:var(--orange);border-radius:20px;padding:2px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.nx-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:12px 0 6px}
.nx-t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.nx-t>span:last-child{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;line-height:1.1}
.nx-vs,.dh-s .vs{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:800;font-style:italic;color:var(--orange);padding:0 6px}
.nx-go{display:block;text-align:right;color:var(--orange);font-weight:600;font-size:14px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);width:100%}
.mrow:first-child{border-top:0}
.mrow.mine{background:var(--orange-soft)}
.mr-l,.mr-r{display:flex;align-items:center;gap:8px;min-width:0}
.mr-l{justify-content:flex-end;text-align:right}
.mr-n{font-size:15px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mr-n.w{font-weight:700}
.mr-s{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;min-width:62px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mr-s i{font-style:normal;color:var(--muted);margin:0 2px}
.mr-s small{font-size:15px;color:var(--muted);font-weight:600}
.mr-sc{grid-column:1/-1;display:grid;grid-template-columns:1fr 62px 1fr;gap:8px;font-size:12px;color:var(--muted);margin-top:-2px}
.mr-sc span:first-child{text-align:right}
.res.U{background:var(--line);color:var(--muted);font-size:12px}
.formline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 18px}
.formline .form{margin:0}
.streak{font-size:14px;font-weight:600}
.good{color:#1E9E5A}.bad{color:#C8402F}
.recs{margin-bottom:22px}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.duel-head{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px}
.dh-t{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dh-t>span:not(.logo){font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;line-height:1.05}
.dh-t small{font-size:12px;opacity:.7}
.dh-s{text-align:center}
.dh-s .num{display:block;font-size:40px;font-weight:800;color:var(--orange);line-height:1}
.dh-s small{font-size:12px;opacity:.7}
.duel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.drow{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.dl{text-align:center;font-size:13px;color:var(--muted);line-height:1.2}
.dv{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.dv.r{text-align:right}
.dv.win{color:var(--orange);font-weight:800}
.dv small{display:block;font-family:"Barlow",sans-serif;font-size:13px;font-weight:600;line-height:1.25}
.form.sm{display:flex;gap:3px;margin:0}
.dv.r .form.sm{justify-content:flex-end}
.form.sm span{width:20px;height:20px;font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.mini-row{display:flex;justify-content:space-between;gap:6px;padding:7px 10px;border-top:1px solid var(--line);font-size:14px}
.mini-row:first-child{border-top:0}
.mini-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:18px}
.lh+.row{border-top:0}

/* ---------- Ruban de navigation et accueil compact ---------- */
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar:empty{display:none}
.tabbar .in{display:flex;max-width:640px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:12px;color:var(--muted);text-align:center;border-radius:10px}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--orange);font-weight:600}
.tabbar button[aria-current="page"] svg{stroke-width:2.4}
.top.slim{padding:10px 16px}
.top.slim svg.court{width:150px;height:150px;top:-40px;right:-50px}
.brand{position:relative;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:800;font-style:italic;line-height:1.05}
.brand b em{color:var(--orange)}
.brand small{display:block;font-size:12px;opacity:.7}
.logo.l40{width:40px;height:40px}.logo.l40 .mono{font-size:13px;border-width:2px}
.club-card .sub{font-size:12px;color:var(--muted);font-family:"Barlow",sans-serif;font-weight:500;margin-top:-4px}

/* ---------- Cotes ---------- */
.mr-odds{grid-column:1/-1;display:grid;grid-template-columns:1fr 62px 1fr;gap:8px;font-size:12px;color:var(--muted);margin-top:-2px}
.mr-odds span:first-child{text-align:right}.mr-odds span:nth-child(2){text-align:center}
.mr-odds b{color:var(--ink);font-weight:600}.mr-odds b.fav{color:var(--orange)}
.mr-odds .one{grid-column:1/-1;text-align:center}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.odd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.odd small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odd .num{font-size:26px;font-weight:700;line-height:1.1}
.odd.fav{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}.odd.fav .num{color:var(--orange)}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 0 6px}
.pbar i{display:block;height:100%}
.verdict{font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:12px;padding:12px 14px;margin:6px 0 16px}
.card .big{font-family:"Barlow Condensed",sans-serif;font-size:25px;font-weight:700;line-height:1.05}
.card p{font-size:14px;color:var(--muted);margin-top:4px}
.rep{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.rep:first-of-type{border-top:0}
.rep span{flex:1}
.rep b{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700}
.rep small{color:var(--muted);width:42px;text-align:right}

/* ---------- Horaire, salle, momentum ---------- */
.next{margin-bottom:10px}
.route{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 22px;color:inherit;text-decoration:none}
.route svg{width:22px;height:22px;color:var(--orange);flex-shrink:0}
.route span.t{flex:1;min-width:0}
.route b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route .go{color:var(--orange);font-weight:600;font-size:14px;white-space:nowrap}
.mr-s .hr{display:block;font-family:"Barlow",sans-serif;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.mom .home{fill:#FF6D00;opacity:.85}.mom .away{fill:var(--ink);opacity:.8}

/* ---------- Supériorité numérique et détail des tirs ---------- */
.pbar.big{height:14px;border-radius:7px;margin:6px 4px 8px}
.shots{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 6px}
.shots b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:18px;margin-right:3px}
.shots i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- Fiche adversaire et recherche ---------- */
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px;margin-bottom:14px}
.fiche h3{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.fiche h3.good{color:#1E9E5A}.fiche h3.bad{color:#C8402F}.fiche h3.info{color:var(--muted)}
.fiche ul{list-style:none}
.fiche li{position:relative;padding:4px 0 4px 20px;font-size:15px;line-height:1.35}
.fiche li::before{content:"";position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.fiche .good+ul li::before{background:#1E9E5A}.fiche .bad+ul li::before{background:#C8402F}
.fiche-h{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.fiche-h b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.bar-top .icon-btn+.icon-btn{margin-left:-2px}
.sheet.full{top:0;bottom:auto;height:100%;max-height:100%;border-radius:0;overflow:auto;transform:translateY(-100%);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet.full.open{transform:none}
.sheet.full .grip{display:none}
.qbar{display:flex;align-items:center;gap:10px}
.qbar button{color:var(--orange);font-weight:600;padding:8px 2px}
#q{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0 12px;outline:none}
#q:focus{border-color:var(--orange)}
#qres .row{padding:9px 12px}
#qres:empty{display:none}

/* ---------- Finitions d'ergonomie ---------- */
button:active,.route:active{opacity:.72}
.tabbar button{font-size:11.5px;min-width:0}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-n{overflow-wrap:anywhere}
@media (max-width:400px){
  .mrow{gap:6px;padding:10px 8px}.mr-l,.mr-r{gap:6px}
  .mr-n{font-size:14px}.mr-s{min-width:56px;font-size:22px}
  .mrow .logo.l32{width:28px;height:28px}
  .mr-sc,.mr-odds{grid-template-columns:1fr 56px 1fr}
}
.nx-top{flex-wrap:nowrap;align-items:flex-start}
.nx-when{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.route b{white-space:normal}
.dh-s small{display:block}
.board{margin-top:12px}.board div{padding:8px 12px}
.board .ttl{font-size:16px}.board .num{font-size:36px;line-height:1.1}.board .lbl{line-height:1.25}
.club-head h1{font-size:26px}.club-head{margin-top:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar{background:#3A3A3A}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.icon-btn.spin svg{animation:none}}
</style>

<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
/* ============ CONFIGURATION ============ */
const BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQZGLWbKFAw9z2IYBoIqk5LVGNu70HT-mFm3ukchTMOOAyKhEqKV8VTlrHBJEZljLVHzpGTNApMpGM/pub?output=csv";
const GID = { joueurs: "2055642853", gardiens: "1898483188", clubs: "1741053301",
              journees: "1084857610", joueursJ: "1109594874",
              matchs: "211389371",   // matchs : gid de l'onglet _Matchs créé par le robot (horaires, salles, momentum, 7 m)
              calendrier: "1933894624" };   // calendrier : gid de l'onglet Calendrier (à renseigner)   // journees / joueursJ : onglets _Data_Journees et _Data_Joueurs_J
const MY_TEAM = "Pays Riolais HB";          // équipe mise en avant (orange) dans les classements
const PLACEHOLDER = "non detaille";          // ligne du score J1, exclue des stats individuelles
const LOGO_DIR = "logos/";                   // logos : logos/<nom-du-club>.png (voir LISTE-LOGOS.txt)

/* ============ OUTILS ============ */
const norm = s => (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const toNum = v => { if(v==null) return 0; const n=parseFloat(String(v).replace(/[%\s\u00a0\u202f]/g,"").replace(",",".")); return isNaN(n)?0:n; };
const pct = (a,b) => b>0 ? a/b : null;
const fmtPct = p => p==null ? "-" : (Math.round(p*1000)/10).toString().replace(".",",")+" %";
const fmt1 = x => (Math.round(x*10)/10).toString().replace(".",",");
const ordM = n => n===1?'1<sup>er</sup>':n+'<sup>e</sup>';
const ordF = n => n===1?'1<sup>re</sup>':n+'<sup>e</sup>';
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true; else if(c===','){row.push(f);f=""}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=""} else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function table(rows){
  const h=rows.findIndex(r=>norm(r[0])==="club"); if(h<0) return [];
  const head=rows[h].map(norm);
  return rows.slice(h+1).map(r=>{const o={};head.forEach((k,i)=>o[k]=(r[i]||"").trim());return o});
}
const col=(o,...keys)=>{for(const k of keys){const f=Object.keys(o).find(x=>x.startsWith(k)); if(f) return o[f];} return "";};
function splitName(full){
  const parts=full.trim().split(/\s+/),last=[],first=[];
  parts.forEach(p=>{(p===p.toUpperCase()&&/[A-Z]/.test(p)&&first.length===0?last:first).push(p)});
  return {first:first.map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" "),last:last.join(" ")||full};
}
const initials=n=>{const s=splitName(n);return((s.first[0]||"")+(s.last[0]||"")).toUpperCase();};
const nameHTML=n=>{const s=splitName(n);return `${esc(s.first)} <span class="ln">${esc(s.last)}</span>`;};
const shortClub=n=>n.replace(/\s*\([A-Z]\)\s*$/,"").replace(/\s+Haute-Sa[oô]ne$/i,"").replace(/^(HBC|HB|CA|CS|JA)\s+/,"").replace(/\s+HB$/,"").replace(/^des\s+/,"");
const mono=n=>{const w=n.replace(/\(.*?\)/g,"").split(/[\s-]+/).filter(x=>x&&!/^(de|des|du)$/i.test(x));return w.map(x=>x[0]).join("").toUpperCase().slice(0,4);};
function logoHTML(club,size){
  return `<span class="logo l${size}"><img src="${LOGO_DIR}${slug(club)}.png" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;mono&quot;>${esc(mono(club))}</span>'"></span>`;
}
function ranked(arr,keyFn){let prev=null,r=0;return arr.map((x,i)=>{const k=keyFn(x);if(k!==prev){r=i+1;prev=k}return{...x,rank:r}});}
const scorerSort=(a,b)=>b.buts-a.buts||(pct(b.buts,b.tirs)||0)-(pct(a.buts,a.tirs)||0);

/* ============ DONNÉES ============ */
let D=null, loading=true;
async function fetchCSV(gid){
  const r=await fetch(`${BASE}&gid=${gid}&single=true&t=${Date.now()}`,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseCSV(await r.text());
}
function build(raw){
  const players=table(raw.joueurs).map(o=>({club:o["club"],name:col(o,"joueur"),buts:toNum(col(o,"total buts")),tirs:toNum(col(o,"total tirs")),excl:toNum(col(o,"total excl"))}))
    .filter(p=>p.club&&p.name&&p.name!=="0"&&norm(p.name)!==PLACEHOLDER);
  const keepers=table(raw.gardiens).map(o=>({club:o["club"],name:col(o,"gardien"),arrets:toNum(col(o,"total arrets")),matchs:toNum(col(o,"nb matchs"))}))
    .filter(g=>g.club&&g.name&&g.name!=="0");
  const clubs=table(raw.clubs).filter(o=>o["club"]&&col(o,"buts marques")!=="").map(o=>{
    const name=o["club"],ps=players.filter(p=>p.club===name);
    const b=ps.reduce((s,p)=>s+p.buts,0),t=ps.reduce((s,p)=>s+p.tirs,0);
    const arr=toNum(col(o,"arrets")),enc=toNum(col(o,"buts encaisses"));
    const rawPT=col(o,"% tir"); let pt=pct(b,t);
    if(rawPT!==""){ pt=toNum(rawPT); if(pt>1) pt=pt/100; }   // % tir corrigé du Comparatif (matchs à stats incomplètes exclus)
    const rawPA=col(o,"% arret"); let pa=null;
    if(rawPA!==""){ pa=toNum(rawPA); if(pa>1) pa=pa/100; }   // % corrigé du Comparatif (journées avec arrêts saisis)
    return {name,marques:toNum(col(o,"buts marques")),encaisses:enc,arrets:arr,pctArret:pa,pctTir:pt,excl:toNum(col(o,"exclusions"))};
  });
  // Classement : colonnes Classement, J, V, N, D, BP, BC, Pts, Diff ajoutées au Comparatif Clubs
  const standings=table(raw.clubs).filter(o=>o["club"]&&o["pts"]!==undefined&&o["pts"]!=="").map(o=>({
    club:o["club"],rank:toNum(o["classement"]),pts:toNum(o["pts"]),j:toNum(o["j"]),v:toNum(o["v"]),n:toNum(o["n"]),d:toNum(o["d"]),bp:toNum(o["bp"]),bc:toNum(o["bc"]),diff:toNum(o["diff"])
  })).sort((a,b)=>a.rank-b.rank);
  const evo=buildEvo(raw);
  // matchs joués par joueur (journées renseignées dans _Data_Joueurs_J)
  players.forEach(p=>{const d=evo&&evo.pj[p.club+"|"+p.name]; p.m=d?d.b.filter((v,i)=>v!=null||d.t[i]!=null).length:0;});
  const cal=buildCal(raw,clubs.map(c=>c.name),evo);
  const hasM=buildMatchs(raw,clubs.map(c=>c.name),cal);
  const nn=s=>norm(s).replace(/\([^)]*\)/g,"").replace(/[^a-z]/g,"");
  players.forEach(p=>{p.b7=0;p.red=0;p.ta=0;p.sh=false;}); clubs.forEach(c=>{c.red=0;c.num=numStats(cal,c.name);});
  cal.forEach(m=>{ if(m.info) (m.info.sh||[]).forEach(x=>{const p=players.find(q=>q.club===x.club&&nn(q.name)===nn(x.nom)); if(p){p.ta+=x.a;p.sh=true;}}); });
  cal.forEach(m=>{ if(!m.info) return;
    (m.info.m7||[]).forEach(x=>{const p=players.find(q=>q.club===x.club&&nn(q.name)===nn(x.nom)); if(p) p.b7+=x.n;});
    (m.info.red||[]).forEach(x=>{const p=players.find(q=>q.club===x.club&&nn(q.name)===nn(x.nom)); if(p) p.red++; const c=clubs.find(c=>c.name===x.club); if(c) c.red++;}); });
  return {players,keepers,clubs,standings,evo,cal,hasM};
}
/* ---------- Évolution par journée ---------- */
function rowsWithHeader(rows,first){
  const h=(rows||[]).findIndex(r=>norm(r[0])===first); if(h<0) return [];
  const head=rows[h].map(norm);
  return rows.slice(h+1).map(r=>{const o={};head.forEach((k,i)=>o[k]=(r[i]||"").trim());return o});
}
function buildEvo(raw){
  if(!raw.journees) return null;
  const games=rowsWithHeader(raw.journees,"club").filter(o=>o["club"]&&toNum(o["joue"])===1&&o["bc"]!=="").map(o=>({
    club:o["club"],j:toNum(o["j"]),adv:o["adversaire"]||"",bp:toNum(o["bp"]),bc:toNum(o["bc"]),
    tirs:(t=>t>toNum(o["bp"])?t:null)(toNum(o["tirs"])),   // tirs <= buts : stats incomplètes, match ignoré pour le % tir
    arrets:o["arrets"]===""?null:toNum(o["arrets"]),excl:toNum(o["excl"])}));
  if(!games.length) return null;
  // adversaire déduit du score si l'en-tête ne le donne pas
  games.forEach(g=>{ if(!g.adv){ const o=games.find(x=>x.j===g.j&&x.club!==g.club&&x.bp===g.bc&&x.bc===g.bp); if(o) g.adv=o.club; } });
  const maxJ=Math.max(...games.map(g=>g.j));
  const clubs=[...new Set(games.map(g=>g.club))];
  const rankHist={}; clubs.forEach(c=>rankHist[c]=[]);
  for(let j=1;j<=maxJ;j++){
    const tab=clubs.map(c=>{const gs=games.filter(g=>g.club===c&&g.j<=j);
      const pts=gs.reduce((s,g)=>s+(g.bp>g.bc?3:g.bp===g.bc?2:1),0), bp=gs.reduce((s,g)=>s+g.bp,0), bc=gs.reduce((s,g)=>s+g.bc,0);
      return {c,pts,diff:bp-bc,bp};}).sort((a,b)=>b.pts-a.pts||b.diff-a.diff||b.bp-a.bp);
    tab.forEach((x,i)=>rankHist[x.c][j-1]=i+1);
  }
  const pj={};
  if(raw.joueursJ){
    rowsWithHeader(raw.joueursJ,"club").forEach(o=>{ if(!o["joueur"]||o["joueur"]==="0") return;
      const b=[],t=[]; for(let j=1;j<=22;j++){ b.push(o["b"+j]===""?null:toNum(o["b"+j])); t.push(o["t"+j]===""?null:toNum(o["t"+j])); }
      pj[o["club"]+"|"+o["joueur"]]={b,t}; });
  }
  return {games,maxJ,rankHist,nClubs:clubs.length,pj};
}
const resOf=g=>g.bp>g.bc?"V":g.bp===g.bc?"N":"D";
/* ---------- Graphiques SVG ---------- */
const W=340,H=150,PL=26,PR=8,PT=14,PB=20;
function xPos(i,n){return PL+(n<=1?(W-PL-PR)/2:i*(W-PL-PR)/(n-1));}
function lineChart(labels,series,{min,max,invert=false,fmt=v=>v,ticks=[]}){
  const n=labels.length, y=v=>{const t=(v-min)/((max-min)||1);return PT+(invert?t:1-t)*(H-PT-PB);};
  let g=ticks.map(t=>`<line class="ax" x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}"/><text x="${PL-5}" y="${y(t)+3}" text-anchor="end">${fmt(t)}</text>`).join("");
  g+=labels.map((l,i)=>`<text x="${xPos(i,n)}" y="${H-5}" text-anchor="middle">${l}</text>`).join("");
  series.forEach(se=>{
    let d="",pen=false;
    se.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?"L":"M")+xPos(i,n).toFixed(1)+","+y(v).toFixed(1); pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${xPos(i,n)}" cy="${y(v)}" r="3.5" fill="${se.color}"/>${se.labels?`<text class="lbl" x="${xPos(i,n)}" y="${y(v)-7}" text-anchor="middle">${fmt(v)}</text>`:""}`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(labels,series,{max}){
  const n=labels.length, slot=(W-PL-PR)/n, bw=Math.min(16,slot/(series.length+0.8)), y=v=>PT+(1-v/(max||1))*(H-PT-PB);
  let g=`<line class="ax" x1="${PL}" x2="${W-PR}" y1="${y(0)}" y2="${y(0)}"/>`;
  labels.forEach((l,i)=>{
    const cx=PL+slot*(i+.5); g+=`<text x="${cx}" y="${H-5}" text-anchor="middle">${l}</text>`;
    series.forEach((se,k)=>{ const v=se.vals[i]; const x=cx-(series.length*bw)/2+k*bw;
      if(v==null){ g+=`<text x="${x+bw/2}" y="${y(0)-4}" text-anchor="middle">·</text>`; return; }
      g+=`<rect x="${x+1}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${se.color}"/><text class="lbl" x="${x+bw/2}" y="${y(v)-3}" text-anchor="middle">${v}</text>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const legend=items=>`<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
function evoClubHTML(c,part){
  const E=D.evo; if(!E) return "";
  const gs=E.games.filter(g=>g.club===c.name).sort((a,b)=>a.j-b.j); if(!gs.length) return "";
  const O="#FF6D00", K="var(--ink)";
  const labels=Array.from({length:E.maxJ},(_,i)=>"J"+(i+1));
  const byJ=j=>gs.find(g=>g.j===j);
  const ranks=E.rankHist[c.name]||[];
  const last5=gs.slice(-5);
  const sk=streak(c.name);
  const forme=`<div class="formline"><div class="form" aria-label="Forme">${last5.map(g=>`<span class="${resOf(g)}" title="J${g.j}">${resOf(g)}</span>`).join("")}</div>${sk?`<span class="streak ${sk.k}">${sk.t}</span>`:""}</div>`;
  if(part==="forme") return `<h2>Forme</h2>`+forme;
  let h=`<h2>Évolution</h2>`;
  h+=`<div class="chart"><h3>Classement après chaque journée</h3>${lineChart(labels,[{vals:ranks,color:O,labels:true}],{min:1,max:E.nClubs,invert:true,ticks:[1,Math.ceil(E.nClubs/2),E.nClubs],fmt:v=>v})}</div>`;
  const bps=labels.map((_,i)=>byJ(i+1)?.bp??null), bcs=labels.map((_,i)=>byJ(i+1)?.bc??null);
  h+=`<div class="chart"><h3>Buts par match</h3>${barChart(labels,[{vals:bps,color:O},{vals:bcs,color:K}],{max:Math.max(1,...bps.filter(v=>v!=null),...bcs.filter(v=>v!=null))})}${legend([[O,"Marqués"],[K,"Encaissés"]])}</div>`;
  const pt=labels.map((_,i)=>{const g=byJ(i+1);return g&&g.tirs?g.bp/g.tirs:null;});
  const pa=labels.map((_,i)=>{const g=byJ(i+1);return g&&g.arrets!=null&&(g.arrets+g.bc)>0?g.arrets/(g.arrets+g.bc):null;});
  if(pt.some(v=>v!=null)||pa.some(v=>v!=null))
    h+=`<div class="chart"><h3>% tir et % arrêt par match</h3>${lineChart(labels,[{vals:pt,color:O},{vals:pa,color:K}],{min:0,max:1,ticks:[0,.5,1],fmt:v=>Math.round(v*100)+"%"})}${legend([[O,"% tir"],[K,"% arrêt"]])}</div>`;
  if(!D.cal.length) h+=`<div class="list matches">${[...gs].reverse().map(g=>`<div class="row"><span class="res ${resOf(g)}">${resOf(g)}</span>
    <span class="who"><span class="n">${g.adv?esc(g.adv):"Adversaire"}</span><span class="c">Journée ${g.j}${g.tirs?`, ${fmtPct(g.bp/g.tirs)} au tir`:""}</span></span>
    <span class="val"><span class="num">${g.bp}-${g.bc}</span></span></div>`).join("")}</div>`;
  return h;
}
function evoPlayerHTML(p){
  const E=D.evo; if(!E) return "";
  const d=E.pj[p.club+"|"+p.name]; if(!d) return "";
  const labels=Array.from({length:E.maxJ},(_,i)=>"J"+(i+1)), b=d.b.slice(0,E.maxJ);
  if(!b.some(v=>v!=null)) return "";
  const played=b.map((v,i)=>v!=null?{v,j:i+1}:null).filter(Boolean), best=played.reduce((a,x)=>x.v>a.v?x:a,played[0]);
  return `<div class="chart" style="margin-top:14px"><h3>Buts par journée</h3>${barChart(labels,[{vals:b,color:"#FF6D00"}],{max:Math.max(1,...played.map(x=>x.v))})}
    <div class="legend"><span>Meilleur match : ${best.v} but${best.v>1?"s":""} (J${best.j})</span><span>· = pas de donnée</span></div></div>`;
}
async function load(spin){
  setSpin(spin);
  try{
    const opt=g=>g?fetchCSV(g).catch(()=>null):Promise.resolve(null);
    const [joueurs,gardiens,clubs,journees,joueursJ,calendrier,matchs]=await Promise.all([fetchCSV(GID.joueurs),fetchCSV(GID.gardiens),fetchCSV(GID.clubs),opt(GID.journees),opt(GID.joueursJ),opt(GID.calendrier),opt(GID.matchs)]);
    const raw={joueurs,gardiens,clubs,journees,joueursJ,calendrier,matchs},built=build(raw);
    if(!built.clubs.length) throw new Error("format");
    for(const k in oddsCache) delete oddsCache[k];
    D={...built,at:Date.now(),offline:false}; store.set("hand-cache",{raw,at:D.at});
  }catch(e){
    const c=store.get("hand-cache");
    if(c) D={...build(c.raw),at:c.at,offline:true}; else D=null;
  }
  loading=false; setSpin(false); render();
}
function setSpin(on){document.querySelectorAll("[data-refresh]").forEach(b=>b.classList.toggle("spin",!!on));}

/* ============ NAVIGATION (#/, #/classement, #/buteurs, #/gardiens, #/club/<slug>) ============ */
const ui={clubTab:"resume",buteurs:"champ",gardiens:"gardiens",metric:"marques",general:"all",jour:"",calAll:""};
function route(){const h=location.hash.replace(/^#\/?/,"").split("/");return{page:h[0]||"home",arg:decodeURIComponent(h[1]||""),arg2:decodeURIComponent(h[2]||"")};}
let depth=0;
const scrollMem={}, navStack=[], hkey=()=>location.hash.replace(/^#\/?/,"");
function go(path){scrollMem[hkey()]=window.scrollY;navStack.push(hkey());depth++;location.hash="#/"+path;}
window.addEventListener("hashchange",()=>{
  const back=navStack.length&&navStack[navStack.length-1]===hkey(); if(back) navStack.pop();   // retour : on retrouve sa position dans la liste
  closeSheet();ui.calAll="";render();window.scrollTo(0,back?(scrollMem[hkey()]||0):0);});

/* ============ GABARITS ============ */
const IC={
  refresh:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`,
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  court:`<svg class="court" viewBox="0 0 200 200" fill="none" stroke="#FF6D00" stroke-width="3" aria-hidden="true"><path d="M200 40 A60 60 0 0 0 200 160"/><path d="M200 10 A90 90 0 0 0 200 190" stroke-dasharray="8 7"/><line x1="200" y1="85" x2="200" y2="115" stroke-width="8"/><line x1="132" y1="96" x2="132" y2="104"/></svg>`,
  table:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>`,
  ball:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c-2.5 3-2.5 15 0 18M3.5 9h17M3.5 15h17"/></svg>`,
  trophy:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 20h8M9 17h6"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>`,
  teams:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>`,
  pin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
  goal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20V6h18v14"/><path d="M3 10h18M8 6v14M16 6v14" stroke-dasharray="2 2.5"/></svg>`
};
const refreshBtn=`<button class="icon-btn" data-search aria-label="Rechercher">${IC.search}</button><button class="icon-btn" data-refresh aria-label="Actualiser les stats">${IC.refresh}</button>`;
const backBtn=`<button class="icon-btn" data-back aria-label="Retour à l'accueil">${IC.back}</button>`;
function pageHead(title,back=true){return `<header class="top">${IC.court}<div class="bar-top">${back?backBtn:""}<div class="t"><div class="page-title">${esc(title)}</div></div>${refreshBtn}</div></header>`;}
function stamp(){
  const d=new Date(D.at),t=d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return `<p class="stamp">${D.offline?"Hors connexion, stats du ":"Mis à jour le "}${t}</p>`;
}
function seg(key,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-seg="${key}" data-v="${v}" aria-pressed="${ui[key]===v}">${l}</button>`).join("")}</div>`;}
function chips(key,opts){return `<div class="chips">${opts.map(([v,l])=>`<button class="chip" data-seg="${key}" data-v="${v}" aria-pressed="${ui[key]===v}">${l}</button>`).join("")}</div>`;}
function playerRow(p,{showClub=true,rank=null,max=1,moy=false,sept=false}={}){
  const avg=p.m?p.buts/p.m:null, v=sept?p.b7:moy?avg||0:p.buts;
  return `<button class="row${showClub&&p.club===MY_TEAM?" mine":""}" data-player="${D.players.indexOf(p)}">
    ${rank!=null?`<span class="rank ${rank===1?"p1":""}">${rank}</span>`:""}
    <span class="avatar">${esc(initials(p.name))}</span>
    <span class="who"><span class="n">${nameHTML(p.name)}</span>
      <span class="c">${showClub?esc(shortClub(p.club))+", ":""}${p.tirs} tirs, ${fmtPct(pct(p.buts,p.tirs))}</span>
      <span class="meter"><i style="width:${Math.round(100*v/max)}%"></i></span></span>
    <span class="val"><span class="num">${sept?p.b7:moy?fmt1(v):p.buts}</span><span class="s">${sept?"sur 7 m":moy?p.buts+" buts":avg!=null?fmt1(avg)+" / match":"buts"}</span></span></button>`;
}
function keeperRow(k,{rank=null,showClub=true,max=1}={}){
  return `<div class="row${showClub&&k.club===MY_TEAM?" mine":""}">${rank!=null?`<span class="rank ${rank===1?"p1":""}">${rank}</span>`:""}
    <span class="avatar">${esc(initials(k.name))}</span>
    <span class="who"><span class="n">${nameHTML(k.name)}</span><span class="c">${showClub?esc(shortClub(k.club))+", ":""}${k.matchs} match${k.matchs>1?"s":""}, ${k.matchs?fmt1(k.arrets/k.matchs):0} par match</span>
    <span class="meter"><i style="width:${Math.round(100*k.arrets/max)}%"></i></span></span>
    <span class="val"><span class="num">${k.arrets}</span><span class="s">arrêts</span></span></div>`;
}

/* ============ PAGES ============ */
function pHome(){
  const nc=nextCard(MY_TEAM), ld=lastDayHTML();
  return `<header class="top slim">${IC.court}<div class="bar-top">
      <div class="brand">${logoHTML(MY_TEAM,40)}<span><b>Honneur <em>masculine</em></b><small>Poule A, saison 2026-2027</small></span></div>${refreshBtn}</div></header>
  <main>
    ${nc}${ld}
    ${!nc&&!ld?`<div class="empty">Ajoute l'onglet Calendrier au fichier pour voir le prochain match et les derniers résultats.</div>`:""}
    ${stamp()}
  </main>`;
}
function pEquipes(){
  const clubs=[...D.clubs].sort((a,b)=>(b.name===MY_TEAM)-(a.name===MY_TEAM)||a.name.localeCompare(b.name,"fr"));
  return pageHead("Les équipes",false)+`<main>
    <div class="clubs-grid">${clubs.map(c=>{const st=D.standings.find(x=>x.club===c.name);
      return `<button class="club-card${c.name===MY_TEAM?" mine":""}" data-go="club/${slug(c.name)}">${logoHTML(c.name,64)}<span>${esc(shortClub(c.name))}</span>${st?`<span class="sub">${ordM(st.rank)}, ${st.pts} pts</span>`:""}</button>`;}).join("")}</div>
    <p class="note">Touchez un club pour voir son classement, son calendrier, ses records et ses joueurs.</p>${stamp()}</main>`;
}
const viewSeg=(opts,cur)=>`<div class="seg" role="group">${opts.map(([p,l])=>`<button data-go="${p}" data-rep aria-pressed="${p===cur}">${l}</button>`).join("")}</div>`;
const SEG_CLASS=[["general","Classement"],["classement","Stats des clubs"]], SEG_JOUEURS=[["buteurs","Buteurs"],["gardiens","Gardiens"]];
const METRICS={
  marques:{l:"Attaque",get:c=>c.marques,desc:true,show:c=>c.marques,sub:c=>`${c.marques} buts marqués`},
  encaisses:{l:"Défense",get:c=>c.encaisses,desc:false,show:c=>c.encaisses,sub:c=>`${c.encaisses} buts encaissés`},
  pctTir:{l:"% tir",get:c=>c.pctTir||0,desc:true,show:c=>fmtPct(c.pctTir),sub:()=>`Hors matchs à stats incomplètes`},
  pctArret:{l:"% arrêt",get:c=>c.pctArret||0,desc:true,show:c=>fmtPct(c.pctArret),sub:c=>`${c.arrets} arrêts, hors journées sans arrêts saisis`},
  arrets:{l:"Total arrêts",get:c=>c.arrets,desc:true,show:c=>c.arrets,sub:c=>`${fmtPct(c.pctArret)} d'arrêts`},
  sup:{l:"Supériorité",get:c=>perP(c.num&&c.num.sup)??-99,desc:true,show:c=>c.num&&c.num.sup.n?sign1(perP(c.num.sup)):"-",sub:c=>c.num&&c.num.sup.n?`${c.num.sup.gf} marqués, ${c.num.sup.ga} encaissés en ${c.num.sup.n} supériorités`:"Pas encore de donnée"},
  inf:{l:"Infériorité",get:c=>perP(c.num&&c.num.inf)??-99,desc:true,show:c=>c.num&&c.num.inf.n?sign1(perP(c.num.inf)):"-",sub:c=>c.num&&c.num.inf.n?`${c.num.inf.gf} marqués, ${c.num.inf.ga} encaissés en ${c.num.inf.n} infériorités`:"Pas encore de donnée"},
  excl:{l:"Discipline",get:c=>c.excl+3*(c.red||0),desc:false,show:c=>c.excl,sub:c=>`${c.excl} exclusions 2 min${c.red?`, ${c.red} carton${c.red>1?"s":""} rouge${c.red>1?"s":""}`:""}`}
};
function clubRank(c,key){const m=METRICS[key];return ranked([...D.clubs].sort((a,b)=>m.desc?m.get(b)-m.get(a):m.get(a)-m.get(b)),x=>m.get(x)).find(x=>x.name===c.name).rank;}
function pClassement(){
  const m=METRICS[ui.metric];
  const cs=ranked([...D.clubs].sort((a,b)=>m.desc?m.get(b)-m.get(a):m.get(a)-m.get(b)),c=>m.get(c));
  const max=Math.max(...cs.map(m.get))||1;
  return pageHead("Classement",false)+`<main>${viewSeg(SEG_CLASS,"classement")}${chips("metric",Object.entries(METRICS).map(([k,v])=>[k,v.l]))}
    <div class="list">${cs.map(c=>`<button class="row${c.name===MY_TEAM?" mine":""}" data-go="club/${slug(c.name)}"><span class="rank ${c.rank===1?"p1":""}">${c.rank}</span>
      ${logoHTML(c.name,32)}<span class="who"><span class="n">${esc(c.name)}</span><span class="c">${m.sub(c)}</span>
      <span class="meter"><i style="width:${Math.round(100*m.get(c)/max)}%"></i></span></span>
      <span class="val"><span class="num">${m.show(c)}</span></span></button>`).join("")}</div>
    <p class="note">${m.desc?"Du plus haut au plus bas.":"Moins, c'est mieux."} Touchez un club pour voir toutes ses stats.</p>${stamp()}</main>`;
}
const sign=n=>n>0?"+"+n:String(n);
function pGeneral(){
  const venue=D.cal.some(m=>m.res), k=venue?ui.general:"all";
  const st=k==="all"?D.standings:venueTable(k), max=Math.max(1,...st.map(x=>x.pts));
  return pageHead("Classement",false)+`<main>${D.standings.length?viewSeg(SEG_CLASS,"general"):""}${venue?chips("general",[["all","Général"],["dom","Domicile"],["ext","Extérieur"]]):""}<div class="list">${st.map(x=>`<button class="row${x.club===MY_TEAM?" mine":""}" data-go="club/${slug(x.club)}"><span class="rank ${x.rank===1?"p1":""}">${x.rank}</span>
    ${logoHTML(x.club,32)}<span class="who"><span class="n">${esc(x.club)}</span><span class="c">${x.j} J, ${x.v} V, ${x.n} N, ${x.d} D, diff. ${sign(x.diff)}</span>
    <span class="meter"><i style="width:${Math.round(100*x.pts/max)}%"></i></span></span>
    <span class="val"><span class="num">${x.pts}</span><span class="s">pts</span></span></button>`).join("")}</div>
    <p class="note">${k==="dom"?"Uniquement les matchs joués à domicile. ":k==="ext"?"Uniquement les matchs joués à l'extérieur. ":""}Victoire 3 points, nul 2, défaite 1. À égalité de points, départage à la différence de buts puis aux buts marqués.</p>${stamp()}</main>`;
}
function pButeurs(){
  let h=viewSeg(SEG_JOUEURS,"buteurs")+chips("buteurs",[["champ","Total"],["moy","Par match"],...(D.hasM?[["sept","7 m"]]:[]),["club","Meilleur par club"]]);
  if(ui.buteurs==="champ"){
    const top=ranked([...D.players].sort(scorerSort).slice(0,30),p=>p.buts+"|"+(pct(p.buts,p.tirs)||0).toFixed(4));
    h+=`<div class="list">${top.map(p=>playerRow(p,{rank:p.rank,max:top[0]?.buts||1})).join("")}</div><p class="note">À buts égaux, le meilleur pourcentage au tir passe devant. J1 non comptée (feuille de match non détaillée).</p>`;
  }else if(ui.buteurs==="sept"){
    const top=ranked(D.players.filter(p=>p.b7>0).sort((a,b)=>b.b7-a.b7||b.buts-a.buts).slice(0,30),p=>p.b7);
    h+=top.length?`<div class="list">${top.map(p=>playerRow(p,{rank:p.rank,max:top[0].b7,sept:true})).join("")}</div><p class="note">Buts marqués sur jet de 7 m, d'après les feuilles de match (les 7 m manqués n'y figurent pas).</p>`:`<div class="empty">Aucun but sur 7 m relevé pour l'instant.</div>`;
  }else if(ui.buteurs==="moy"){
    const pool=D.players.filter(p=>p.m>=2), avg=p=>p.buts/p.m;
    const top=ranked(pool.sort((a,b)=>avg(b)-avg(a)||b.buts-a.buts).slice(0,30),p=>avg(p).toFixed(4));
    h+=top.length?`<div class="list">${top.map(p=>playerRow(p,{rank:p.rank,max:top[0]?avg(top[0]):1,moy:true})).join("")}</div><p class="note">Buts par match joué, joueurs ayant disputé au moins 2 matchs. J1 non comptée.</p>`:`<div class="empty">Il faut au moins 2 matchs joués pour ce classement.</div>`;
  }else{
    const best=D.clubs.map(c=>D.players.filter(p=>p.club===c.name).sort(scorerSort)[0]).filter(Boolean).sort(scorerSort);
    h+=`<div class="list">${best.map(p=>playerRow(p,{max:best[0]?.buts||1})).join("")}</div>`;
  }
  return pageHead("Joueurs",false)+`<main>${h}${stamp()}</main>`;
}
function pGardiens(){
  let h=viewSeg(SEG_JOUEURS,"gardiens")+chips("gardiens",[["gardiens","Individuel"],["pct","% arrêt équipe"],["total","Arrêts équipe"]]);
  if(ui.gardiens==="gardiens"){
    const ks=ranked(D.keepers.filter(k=>k.matchs>0).sort((a,b)=>b.arrets-a.arrets||a.matchs-b.matchs).slice(0,20),k=>k.arrets+"|"+k.matchs);
    h+=`<div class="list">${ks.map(k=>keeperRow(k,{rank:k.rank,max:ks[0]?.arrets||1})).join("")}</div>
      <p class="note">La feuille de match ne donne pas les buts encaissés par gardien : le pourcentage d'arrêt n'existe qu'au niveau de l'équipe (filtre « % arrêt équipe »).</p>`;
  }else{
    const byPct=ui.gardiens==="pct";
    const cs=ranked([...D.clubs].sort((a,b)=>byPct?((b.pctArret||0)-(a.pctArret||0)||b.arrets-a.arrets):(b.arrets-a.arrets||(b.pctArret||0)-(a.pctArret||0))),c=>byPct?(c.pctArret||0).toFixed(4):c.arrets+"|"+(c.pctArret||0).toFixed(4));
    const max=Math.max(...cs.map(c=>byPct?(c.pctArret||0):c.arrets))||1;
    h+=`<div class="list">${cs.map(c=>{const v=byPct?(c.pctArret||0):c.arrets;return `<button class="row${c.name===MY_TEAM?" mine":""}" data-go="club/${slug(c.name)}"><span class="rank ${c.rank===1?"p1":""}">${c.rank}</span>
      ${logoHTML(c.name,32)}<span class="who"><span class="n">${esc(c.name)}</span><span class="c">${c.arrets} arrêts, ${c.encaisses} buts encaissés</span>
      <span class="meter"><i style="width:${Math.round(100*v/max)}%"></i></span></span>
      <span class="val"><span class="num">${byPct?fmtPct(c.pctArret):c.arrets}</span></span></button>`}).join("")}</div>
      <p class="note">% d'arrêt équipe = arrêts ÷ (arrêts + buts encaissés), calculé uniquement sur les journées où les arrêts sont saisis.</p>`;
  }
  return pageHead("Joueurs",false)+`<main>${h}${stamp()}</main>`;
}
function pClub(s){
  const c=D.clubs.find(x=>slug(x.name)===s); if(!c) return pageHead("Club introuvable")+`<main><div class="empty">Ce club n'existe pas dans le fichier.</div></main>`;
  const ps=D.players.filter(p=>p.club===c.name).sort(scorerSort), ks=D.keepers.filter(k=>k.club===c.name).sort((a,b)=>b.arrets-a.arrets);
  const st=D.standings.find(x=>x.club===c.name), T=ui.clubTab||"resume";
  const r=k=>clubRank(c,k), maxP=Math.max(1,...ps.map(p=>p.buts)), maxK=Math.max(1,...ks.map(k=>k.arrets));
  const rk=(k,l)=>{const v=r(k);return `<div class="rk${v===1?" best":""}"><div class="num">${ordM(v)}</div><div class="l">${l}</div></div>`;};
  return `<header class="top">${IC.court}<div class="bar-top">${backBtn}<div class="t"></div>${refreshBtn}</div>
    <div class="club-head">${logoHTML(c.name,72)}<div><h1>${esc(c.name)}</h1><div class="sub">Honneur masculine, poule A</div></div></div>
    <div class="board"><div><div class="ttl">Buts marqués</div><div class="num">${c.marques}</div><div class="lbl">${ordF(r("marques"))} attaque de la poule</div></div>
      <div><div class="ttl">Buts encaissés</div><div class="num">${c.encaisses}</div><div class="lbl">${ordF(r("encaisses"))} défense de la poule</div></div></div>
    <div class="minis"><div><b>${fmtPct(c.pctTir)}</b>Réussite au tir</div><div><b>${fmtPct(c.pctArret)}</b>Arrêts équipe</div><div><b>${c.excl}</b>Exclusions 2 min</div></div></header>
  <main>${seg("clubTab",[["resume","Résumé"],["stats","Statistiques"],["effectif","Effectif"]])}
    ${T==="resume"?`${nextCard(c.name)}
    ${st?`<h2>Classement</h2><div class="standing"><div class="pos"><div class="num">${ordM(st.rank)}</div><div class="l">sur ${D.standings.length}</div></div>
      <div class="grid"><div><div class="num">${st.pts}</div><div class="l">Points</div></div><div><div class="num">${sign(st.diff)}</div><div class="l">Goal average</div></div><div><div class="num">${st.j}</div><div class="l">Matchs joués</div></div>
      <div><div class="num">${st.v}</div><div class="l">Victoires</div></div><div><div class="num">${st.n}</div><div class="l">Nuls</div></div><div><div class="num">${st.d}</div><div class="l">Défaites</div></div></div></div>`:""}
    ${evoClubHTML(c,"forme")}
    ${clubCalHTML(c)}
    <h2>Rang par statistique</h2>
    <div class="ranks">${rk("marques","Attaque")}${rk("encaisses","Défense")}${rk("pctTir","% tir")}${rk("pctArret","% arrêt")}${rk("arrets","Total arrêts")}${rk("excl","Discipline")}</div>`:""}
    ${T==="stats"?`${evoClubHTML(c,"courbes")}${recordsHTML(c)}${numHTML(c)}${D.evo?"":`<div class="empty">Les statistiques détaillées apparaîtront après la première journée.</div>`}`:""}
    ${T==="effectif"?`<h2>Joueurs</h2>
    ${ps.length?`<div class="list">${ps.map(p=>playerRow(p,{showClub:false,max:maxP})).join("")}</div>`:`<div class="empty">Aucun joueur saisi.</div>`}
    <h2 style="margin-top:22px">Gardiens</h2>
    ${ks.length?`<div class="list">${ks.map(k=>keeperRow(k,{showClub:false,max:maxK})).join("")}</div>`:`<div class="empty">Aucun gardien saisi.</div>`}
    <p class="note">La J1 compte dans les totaux d'équipe mais pas dans les stats individuelles (feuille de match non détaillée).</p>`:""}
    ${stamp()}</main>`;
}
function render(){
  const app=document.getElementById("app");
  if(!D){ document.getElementById("tabbar").innerHTML=""; app.innerHTML=`<header class="top">${IC.court}<div class="bar-top"><div class="t"><div class="page-title">Stats Hand</div></div>${refreshBtn}</div></header>
    <main>${loading?`<div class="empty">Chargement des stats…</div>`:`<div class="error"><b>Impossible de charger les stats</b>Vérifie ta connexion internet, puis appuie sur le bouton d'actualisation.</div>`}</main>`; return; }
  const {page,arg,arg2}=route();
  app.innerHTML=({home:pHome,classement:pClassement,buteurs:pButeurs,gardiens:pGardiens,club:()=>pClub(arg),general:pGeneral,journees:()=>pJournees(arg),duel:()=>pDuel(arg,arg2),equipes:pEquipes}[page]||pHome)();
  const tab={journees:"journees",duel:"journees",general:"general",classement:"general",buteurs:"buteurs",gardiens:"buteurs",equipes:"equipes",club:"equipes"}[page]||"home";
  const tabs=[["home","Accueil",IC.home],...(D.cal.length?[["journees","Calendrier",IC.cal]]:[]),[D.standings.length?"general":"classement","Classement",IC.trophy],["buteurs","Joueurs",IC.ball],["equipes","Équipes",IC.teams]];

/* ============ CALENDRIER, DUELS, RECORDS ============ */
const DAY=864e5;
function parseDate(s){ s=(s||"").trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(+m[3],m[2]-1,+m[1]); return null; }
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
function wkLabel(d){ if(!d) return ""; const s=new Date(d.getTime()+DAY), mo=x=>x.toLocaleDateString("fr-FR",{month:"short"});
  return d.getMonth()===s.getMonth()?`${d.getDate()}-${s.getDate()} ${mo(s)}`:`${d.getDate()} ${mo(d)} - ${s.getDate()} ${mo(s)}`; }
function buildCal(raw,names,evo){
  if(!raw.calendrier) return [];
  const find=n=>names.find(x=>slug(x)===slug(n))||n.trim();
  const cal=rowsWithHeader(raw.calendrier,"j").filter(o=>toNum(o["j"])>0&&o["domicile"]&&o["exterieur"])
    .map(o=>({j:toNum(o["j"]),date:parseDate(col(o,"samedi","week","date")),home:find(o["domicile"]),away:find(o["exterieur"])}));
  const gs=evo?evo.games:[];
  cal.forEach(m=>{ const g=gs.find(x=>x.club===m.home&&x.j===m.j), g2=gs.find(x=>x.club===m.away&&x.j===m.j);
    m.res=g?{h:g.bp,a:g.bc}:g2?{h:g2.bc,a:g2.bp}:null; });
  // lieu du match connu : on complète l'adversaire si besoin
  gs.forEach(g=>{ const m=cal.find(x=>x.j===g.j&&(x.home===g.club||x.away===g.club)); if(m){ g.home=m.home===g.club; if(!g.adv) g.adv=g.home?m.away:m.home; } });
  return cal;
}
function calInfo(){
  const C=D.cal; if(!C.length) return null;
  const Js=[...new Set(C.map(m=>m.j))].sort((a,b)=>a-b), played=j=>C.some(m=>m.j===j&&m.res);
  const last=[...Js].reverse().find(played)||null, t=today0();
  const next=Js.find(j=>j>(last||0)&&(()=>{const d=C.find(m=>m.j===j&&m.date)?.date;return !d||d.getTime()+2*DAY>t;})())||Js.find(j=>j>(last||0))||null;
  return {Js,last,next};
}
function nextMatch(club){
  const t=today0();
  return D.cal.filter(m=>(m.home===club||m.away===club)&&!m.res&&(!m.date||m.date.getTime()+2*DAY>t))
    .sort((a,b)=>((a.date?a.date.getTime():0)-(b.date?b.date.getTime():0))||a.j-b.j)[0]||null;
}
const pName=n=>{const s=splitName(n);return (s.first?s.first[0]+". ":"")+s.last;};
function scorers(club,j){
  const pj=D.evo?D.evo.pj:{};
  return Object.entries(pj).filter(([k,d])=>k.startsWith(club+"|")&&d.b[j-1]>0).map(([k,d])=>({name:k.slice(club.length+1),b:d.b[j-1]}))
    .filter(x=>norm(x.name)!==PLACEHOLDER).sort((a,b)=>b.b-a.b);
}
function streak(club){
  const rs=(D.evo?D.evo.games:[]).filter(g=>g.club===club).sort((a,b)=>a.j-b.j).map(resOf); if(!rs.length) return null;
  const run=f=>{let n=0;for(let i=rs.length-1;i>=0&&f(rs[i]);i--)n++;return n;};
  const last=rs[rs.length-1], same=run(r=>r===last), unb=run(r=>r!=="D"), winless=run(r=>r!=="V");
  if(last==="V") return same>1?{t:`${same} victoires de suite`,k:"good"}:{t:"Sur une victoire",k:"good"};
  if(last==="N") return unb>1?{t:`Invaincu depuis ${unb} matchs`,k:"good"}:{t:"Sur un match nul",k:""};
  if(winless>same) return {t:`Sans victoire depuis ${winless} matchs`,k:"bad"};
  return same>1?{t:`${same} défaites de suite`,k:"bad"}:{t:"Sur une défaite",k:"bad"};
}
function venueRec(club,kind){
  const x={j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0};
  D.cal.forEach(m=>{ if(!m.res||(kind==="dom"?m.home:m.away)!==club) return;
    const bp=kind==="dom"?m.res.h:m.res.a, bc=kind==="dom"?m.res.a:m.res.h;
    x.j++;x.bp+=bp;x.bc+=bc; if(bp>bc){x.v++;x.pts+=3}else if(bp===bc){x.n++;x.pts+=2}else{x.d++;x.pts+=1} });
  x.diff=x.bp-x.bc; return x;
}
function venueTable(kind){
  const arr=D.clubs.map(c=>({club:c.name,...venueRec(c.name,kind)})).sort((a,b)=>b.pts-a.pts||b.diff-a.diff||b.bp-a.bp);
  return ranked(arr,x=>x.pts+"|"+x.diff+"|"+x.bp);
}
const recTxt=x=>x.j?`${x.v} V, ${x.n} N, ${x.d} D`:"Aucun match";

/* ============ ONGLET _Matchs : horaire, salle, momentum, 7 m, cartons rouges ============ */
function buildMatchs(raw,names,cal){
  if(!raw.matchs) return false;
  const find=n=>names.find(x=>slug(x)===slug(n));
  let ok=false;
  rowsWithHeader(raw.matchs,"j").forEach(o=>{
    const j=toNum(o["j"]), h=find(o["domicile"]), a=find(o["exterieur"]); if(!h||!a) return;
    const m=cal.find(x=>x.j===j&&x.home===h&&x.away===a); if(!m) return;
    const I={}; ok=true;
    const mm=(o["date"]||"").match(/^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/);
    if(mm){ I.dt=new Date(+mm[1],mm[2]-1,+mm[3],+mm[4],+mm[5]);
      const sat=new Date(I.dt); sat.setHours(0,0,0,0); sat.setDate(sat.getDate()-((sat.getDay()+1)%7));
      if(!m.date||Math.abs(sat-m.date)>2*DAY) m.date=sat; }          // match déplacé : on suit la vraie date
    I.salle=o["salle"]||""; I.adresse=o["adresse"]||""; I.lat=o["lat"]||""; I.lng=o["lng"]||"";
    if((o["mt dom"]||"")!=="") I.mt=[toNum(o["mt dom"]),toNum(o["mt ext"])];
    const der=o["deroule"]||"";
    if(der&&der!=="ND") I.der=der.split(" ").map(x=>{const [t,sc]=x.split(":");const [p,q]=(sc||"").split("-");return [+t,+p,+q];}).filter(x=>!isNaN(x[1]));
    const side=c=>c==="D"?h:a;
    I.m7=(o["buts 7m"]||"").split("|").filter(Boolean).map(x=>{const r=x.slice(2),i=r.lastIndexOf("=");return {club:side(x[0]),nom:r.slice(0,i),n:+r.slice(i+1)};});
    I.red=(o["rouges"]||"").split("|").filter(Boolean).map(x=>({club:side(x[0]),nom:x.slice(2)}));
    I.ex=(o["exclusions"]||"").split(" ").filter(Boolean).map(x=>[+x.slice(2),x[0]==="D"?"h":"a"]).filter(x=>!isNaN(x[0]));
    I.sh=(o["tirs"]||"").split("|").filter(Boolean).map(x=>{const r=x.slice(2),i=r.lastIndexOf("="),v=r.slice(i+1).split("/");return {club:side(x[0]),nom:r.slice(0,i),a:+v[0]||0,h:+v[1]||0};});
    I.v2=(o["v"]||"")!=="";
    m.info=I;
  });
  return ok;
}
const fmtDT=d=>{const s=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});return s.charAt(0).toUpperCase()+s.slice(1)+", "+d.getHours()+"h"+String(d.getMinutes()).padStart(2,"0");};
const fmtDay=d=>d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","")+" "+d.getHours()+"h"+String(d.getMinutes()).padStart(2,"0");
function routeHTML(m){
  const I=m.info; if(!I||!I.salle) return "";
  const dest=I.lat&&I.lng?`${I.lat},${I.lng}`:encodeURIComponent(I.salle+" "+I.adresse);
  const cap=s=>s.toLowerCase().replace(/(^|[\s'-])\S/g,c=>c.toUpperCase());

function momentumHTML(m){

  d+=` L${x(T)},${y(prev).toFixed(1)}`;
  const area=d+` L${x(T)},${y0} Z`, id="c"+m.j+slug(m.home).slice(0,6);
  let g=`<defs><clipPath id="${id}u"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="${id}d"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>`;
  g+=`<path class="home" d="${area}" clip-path="url(#${id}u)"/><path class="away" d="${area}" clip-path="url(#${id}d)"/>`;
  g+=`<line class="ax" x1="${PL}" x2="${W-PR}" y1="${y0}" y2="${y0}"/><line class="ax" x1="${x(1800)}" x2="${x(1800)}" y1="${PT}" y2="${H-PB}" stroke-dasharray="3 3"/>`;
  [0,15,30,45,60].forEach(mn=>g+=`<text x="${x(mn*60)}" y="${H-5}" text-anchor="middle">${mn}'</text>`);
  [mx,-mx].forEach(v=>g+=`<text x="${PL-5}" y="${y(v)+4}" text-anchor="end">+${Math.abs(v)}</text>`);
  g+=`<text class="lbl" x="${PL+4}" y="${PT+9}">${esc(shortClub(m.home))}</text><text class="lbl" x="${PL+4}" y="${H-PB-5}">${esc(shortClub(m.away))}</text><text x="${x(1800)+4}" y="${PT+9}">MT</text>`;
  // repères

  let bestH={v:0},bestA={v:0},run={n:0},cur={n:0,side:null},leads=0,lastSign=0,ps=[0,0];

    if(df>bestH.v) bestH={v:df,t}; if(-df>bestA.v) bestA={v:-df,t};
    if(side===cur.side){cur.n++;cur.t1=t;} else cur={n:1,side,t0:t,t1:t,from:ps.slice()};
    if(cur.n>run.n) run={...cur,to:[h,a]};
    const sg=Math.sign(df); if(sg&&lastSign&&sg!==lastSign) leads++; if(sg) lastSign=sg; ps=[h,a]; });
  const kv=[["Mi-temps",`${mt[0]}-${mt[1]}`]];
  if(bestH.v) kv.push([`Plus gros écart pour ${shortClub(m.home)}`,`+${bestH.v} (${mn(bestH.t)})`]);
  if(bestA.v) kv.push([`Plus gros écart pour ${shortClub(m.away)}`,`+${bestA.v} (${mn(bestA.t)})`]);

    <div class="list" style="margin-bottom:22px">${kv.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>`;
}


/* ---------- Supériorité / infériorité numérique (exclusions de 2 min + déroulé du score) ---------- */
function numStats(cal,club){
  const S={sup:{n:0,gf:0,ga:0},inf:{n:0,gf:0,ga:0},m:0};
  cal.forEach(m=>{ const I=m.info; if(!I||!I.der||!I.v2||(m.home!==club&&m.away!==club)) return;
    const me=m.home===club?"h":"a"; S.m++;
    I.ex.forEach(([t,sd])=>{ (sd===me?S.inf:S.sup).n++; });
    let ps=[0,0];
    I.der.forEach(([t,h,a])=>{ const scorer=h>ps[0]?"h":"a"; ps=[h,a];
      let nh=0,na=0; I.ex.forEach(([te,sd])=>{ if(te<t&&t<=te+120){ if(sd==="h") nh++; else na++; } });
      if(nh===na) return;                                   // égalité numérique
      const B=(nh>na?"a":"h")===me?S.sup:S.inf;            // l'équipe en supériorité est celle qui a le moins d'exclus
      if(scorer===me) B.gf++; else B.ga++; });
  });
  return S.m?S:null;
}
const perP=x=>x&&x.n?(x.gf-x.ga)/x.n:null;
const sign1=v=>(v>0?"+":"")+fmt1(v);
function numHTML(c){
  const N=c.num; if(!N||(!N.sup.n&&!N.inf.n)) return "";
  const card=(t,x,txt)=>`<div class="stat"><div class="num ${x.gf-x.ga>0?"good":x.gf-x.ga<0?"bad":""}">${sign(x.gf-x.ga)}</div><div class="l">${t}</div>
    <div class="d">${x.n?`${x.gf} marqué${x.gf>1?"s":""}, ${x.ga} encaissé${x.ga>1?"s":""} en ${x.n} période${x.n>1?"s":""} de 2 min ${txt}`:"Aucune période pour l'instant"}</div></div>`;
  return `<h2>Supériorité et infériorité</h2><div class="stats recs">${card("En supériorité numérique",N.sup,"à un de plus")}${card("En infériorité numérique",N.inf,"à un de moins")}</div>`;
}
function shotsHTML(p){
  if(!p.sh||!p.tirs) return "";
  const ar=Math.min(p.ta,Math.max(0,p.tirs-p.buts)), hc=Math.max(0,p.tirs-p.buts-ar), T=p.tirs||1;

/* ============ COTES (modèle de force des équipes) ============
   Note de force par équipe = moindres carrés sur les écarts de buts, adversaire pris en compte,
   tirée vers la moyenne en début de saison. Écart prévu = note dom. - note ext. + avantage domicile.
   L'écart réel varie autour de la prévision (loi normale) : on en tire les probabilités 1 / N / 2. */
const ODDS={home:1.5,shrink:4,sigmaMin:5.5,margin:1.07};
const oddsCache={};
function modelBefore(j){
  if(oddsCache[j]) return oddsCache[j];
  const teams=D.clubs.map(c=>c.name), idx=Object.fromEntries(teams.map((t,i)=>[t,i])), n=teams.length;
  const ms=D.cal.filter(m=>m.res&&m.j<j&&idx[m.home]!=null&&idx[m.away]!=null);
  if(!ms.length) return oddsCache[j]=null;
  const A=Array.from({length:n},(_,i)=>Array.from({length:n},(_,k)=>i===k?ODDS.shrink:0)), b=Array(n).fill(0);
  ms.forEach(m=>{const h=idx[m.home],a=idx[m.away],y=m.res.h-m.res.a-ODDS.home;
    A[h][h]++;A[a][a]++;A[h][a]--;A[a][h]--;b[h]+=y;b[a]-=y;});
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;   // Gauss
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<n;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }
  const r=b.map((v,i)=>v/A[i][i]);
  const res=ms.map(m=>m.res.h-m.res.a-ODDS.home-(r[idx[m.home]]-r[idx[m.away]]));
  const sigma=Math.max(ODDS.sigmaMin,Math.sqrt(res.reduce((s,x)=>s+x*x,0)/res.length+1));
  return oddsCache[j]={r:Object.fromEntries(teams.map((t,i)=>[t,r[i]])),sigma,n:ms.length};
}
const Phi=z=>{const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;};
function oddsOf(m){
  const M=modelBefore(m.j); if(!M) return null;
  const d=(M.r[m.home]||0)-(M.r[m.away]||0)+ODDS.home, s=M.sigma;
  const p1=1-Phi((0.5-d)/s), pn=Phi((0.5-d)/s)-Phi((-0.5-d)/s), p2=Phi((-0.5-d)/s);
  const c=p=>Math.max(1.01,1/(p*ODDS.margin));
  return {d,p1,pn,p2,c1:c(p1),cn:c(pn),c2:c(p2),fav:p1>=p2?"h":"a"};
}
const fmtC=c=>c>=10?String(Math.round(c)):c.toFixed(2).replace(".",",");
function oddsLine(m){
  const o=oddsOf(m); if(!o) return "";
  if(!m.res) return `<span class="mr-odds"><span><b class="${o.fav==="h"?"fav":""}">${fmtC(o.c1)}</b></span><span>N ${fmtC(o.cn)}</span><span><b class="${o.fav==="a"?"fav":""}">${fmtC(o.c2)}</b></span></span>`;
  const favName=o.fav==="h"?m.home:m.away, ok=o.fav==="h"?m.res.h>m.res.a:m.res.a>m.res.h;
  return `<span class="mr-odds"><span class="one">Favori ${esc(shortClub(favName))} (${fmtC(o.fav==="h"?o.c1:o.c2)}) ${ok?`<b class="good">✓ vu juste</b>`:`<b class="bad">✗ surprise</b>`}</span></span>`;
}
function oddsBlock(m){
  const o=oddsOf(m); if(!o) return "";
  const O="#FF6D00", G="#8A8A8A", K="var(--ink)";
  const fav=o.fav==="h"?m.home:m.away, ecart=Math.round(Math.abs(o.d));
  let v="";
  if(m.res){ const ok=o.fav==="h"?m.res.h>m.res.a:m.res.a>m.res.h; v=` <span class="verdict ${ok?"good":"bad"}">${ok?"✓ Le favori a gagné":"✗ Surprise"}</span>`; }
  return `<h2>Cotes${m.res?` <span class="h2s">avant le match</span>`:""}</h2>
    <div class="odds"><div class="odd${o.fav==="h"?" fav":""}"><small>${esc(shortClub(m.home))}</small><div class="num">${fmtC(o.c1)}</div></div>
      <div class="odd"><small>Match nul</small><div class="num">${fmtC(o.cn)}</div></div>
      <div class="odd${o.fav==="a"?" fav":""}"><small>${esc(shortClub(m.away))}</small><div class="num">${fmtC(o.c2)}</div></div></div>
    <div class="pbar"><i style="width:${o.p1*100}%;background:${o.fav==="h"?O:K}"></i><i style="width:${o.pn*100}%;background:${G}"></i><i style="width:${o.p2*100}%;background:${o.fav==="a"?O:K}"></i></div>
    <p class="note" style="margin-top:0">${ecart>=1?`${esc(shortClub(fav))} favori, écart prévu d'environ ${ecart} but${ecart>1?"s":""}.`:"Match très serré, aucun favori net."}${v}<br>Estimation à partir des résultats de la saison (force de chaque équipe, adversaires et avantage du terrain). ${modelBefore(m.j).n<24?"Peu de matchs joués : cotes encore peu fiables.":""}</p>`;
}
function oddsReport(jSel){
  const all=D.cal.filter(m=>m.res&&oddsOf(m)); if(!all.length) return "";
  const stat=ms=>{let ok=0,sur=null; ms.forEach(m=>{const o=oddsOf(m), fh=o.fav==="h", won=fh?m.res.h>m.res.a:m.res.a>m.res.h; if(won) ok++;
    else if(m.res.h!==m.res.a){ const c=fh?o.c2:o.c1; if(!sur||c>sur.c) sur={m,c}; }}); return {ok,n:ms.length,sur};};
  const S=stat(all), day=all.filter(m=>m.j===jSel), J=day.length?stat(day):null;
  const Js=[...new Set(all.map(m=>m.j))].sort((a,b)=>a-b), range=Js.length>1?`J${Js[0]} à J${Js[Js.length-1]}`:`J${Js[0]}`;
  const line=(t,x)=>`<div class="rep"><span>${t}</span><b>${x.ok} / ${x.n}</b><small>${Math.round(100*x.ok/x.n)} %</small></div>`;
  const sur=(J&&J.sur)||S.sur;
  return `<div class="card"><h3 style="font-family:'Barlow Condensed',sans-serif;font-size:19px">Fiabilité des cotes</h3><p style="margin:0 0 4px">Nombre de favoris qui ont gagné</p>
    ${J?line(`Journée ${jSel}`,J):""}${line(`Saison (${range})`,S)}
    ${sur?`<p>Plus grosse surprise ${J&&J.sur?"de la journée":"de la saison"} : ${esc(shortClub(sur.m.res.h>sur.m.res.a?sur.m.home:sur.m.away))} gagne à ${fmtC(sur.c)} (J${sur.m.j}, ${sur.m.res.h}-${sur.m.res.a}).</p>`:""}
    <p>Cotes calculées avant chaque match, avec uniquement les résultats connus à ce moment-là. La J1 n'est pas comptée (aucun résultat avant).</p></div>`;
}

/* ============ FICHE ADVERSAIRE (points forts et faibles rédigés à partir des rangs) ============ */
const ordT=n=>n===1?"1re":n+"e";
function ficheHTML(name,kind){
  const c=D.clubs.find(x=>x.name===name); if(!c) return "";
  const n=D.clubs.length, X=clubData(name), nb=X.n; if(!nb) return "";
  const rk=k=>clubRank(c,k), top=r=>r<=3, low=r=>r>=n-2;
  const F=[],W=[],I=[];
  let r=rk("marques"); const am=fmt1(c.marques/nb);
  if(top(r)) F.push(`${ordT(r)} attaque de la poule, ${am} buts par match`); else if(low(r)) W.push(`Attaque en difficulté : ${am} buts par match (${ordT(r)} de la poule)`);
  r=rk("encaisses"); const de=fmt1(c.encaisses/nb);
  if(top(r)) F.push(`${ordT(r)} défense de la poule, ${de} buts encaissés par match`); else if(low(r)) W.push(`Défense perméable : ${de} buts encaissés par match`);
  if(c.pctTir!=null){ r=rk("pctTir"); if(top(r)) F.push(`Adroite au tir : ${fmtPct(c.pctTir)} de réussite`); else if(low(r)) W.push(`Maladroite au tir : ${fmtPct(c.pctTir)} de réussite`); }
  if(c.pctArret!=null){ r=rk("pctArret"); if(top(r)) F.push(`Gardiens performants : ${fmtPct(c.pctArret)} d'arrêts`); else if(low(r)) W.push(`Peu d'arrêts : ${fmtPct(c.pctArret)}`); }
  r=rk("excl"); const ex=fmt1(c.excl/nb);
  if(top(r)) F.push(`Équipe disciplinée : ${ex} exclusion${c.excl/nb>=2?"s":""} par match`); else if(low(r)) W.push(`Beaucoup d'exclusions (${ex} par match) : des supériorités à exploiter`);
  if(c.num&&c.num.sup.n>=2){ const v=perP(c.num.sup); r=rk("sup"); if(top(r)&&v>0) F.push(`Efficace en supériorité numérique (${sign1(v)} par 2 min)`); else if(low(r)) W.push(`Peu efficace en supériorité numérique (${sign1(v)} par 2 min)`); }
  if(c.num&&c.num.inf.n>=2){ const v=perP(c.num.inf); r=rk("inf"); if(top(r)&&v>=0) F.push(`Solide en infériorité numérique (${sign1(v)} par 2 min)`); else if(low(r)&&v<0) W.push(`Souffre en infériorité numérique (${sign1(v)} par 2 min)`); }
  if(D.cal.some(m=>m.res)){ const v=venueRec(name,kind), ou=kind==="dom"?"à domicile":"à l'extérieur";
    if(v.j>=2&&v.d===0) F.push(`Invaincue ${ou} (${recTxt(v)})`); else if(v.j>=2&&v.v===0) W.push(`Aucune victoire ${ou} (${recTxt(v)})`); }
  if(X.streak){ if(X.streak.k==="good"&&/suite|Invaincu/.test(X.streak.t)) F.push(`En forme : ${X.streak.t.toLowerCase()}`); else if(X.streak.k==="bad"&&/suite|Sans/.test(X.streak.t)) W.push(`En difficulté : ${X.streak.t.toLowerCase()}`); }
  const ps=D.players.filter(p=>p.club===name).sort(scorerSort), tot=ps.reduce((a,p)=>a+p.buts,0);
  if(ps[0]&&tot){ const sh=ps[0].buts/tot; I.push(`${pName(ps[0].name)} marque ${fmtPct(sh)} des buts de l'équipe${sh>=.3?" : attaque très dépendante":""}`); }
  if(ps[0]&&ps[0].sh&&ps[0].tirs>ps[0].buts) I.push(`Ses tirs manqués : ${Math.min(ps[0].ta,ps[0].tirs-ps[0].buts)} arrêté${ps[0].ta>1?"s":""}, ${Math.max(0,ps[0].tirs-ps[0].buts-ps[0].ta)} hors cadre`);
  const b7=ps.filter(p=>p.b7>0).sort((a,b)=>b.b7-a.b7)[0]; if(b7) I.push(`Aux 7 m : ${pName(b7.name)} (${b7.b7} marqué${b7.b7>1?"s":""})`);
  const k=D.keepers.filter(k=>k.club===name&&k.matchs>0).sort((a,b)=>b.arrets-a.arrets)[0];
  if(k) I.push(`Le gardien : ${pName(k.name)}, ${fmt1(k.arrets/k.matchs)} arrêts par match`);
  const last=X.gs.slice(-3).reverse().map(g=>`${resOf(g)==="V"?"victoire":resOf(g)==="N"?"nul":"défaite"} ${g.bp}-${g.bc} contre ${shortClub(g.adv||"?")}`);
  if(last.length) I.push(`Derniers matchs : ${last.join(", ")}`);
  const ul=(cls,t,a)=>a.length?`<h3 class="${cls}">${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  return `<div class="fiche"><div class="fiche-h">${logoHTML(name,32)}<b>${esc(name)}</b></div>${ul("good","Points forts",F)}${ul("bad","Points faibles",W)}${ul("info","À savoir",I)}
    ${!F.length&&!W.length?`<p class="note" style="margin:6px 0 0">Pas de point saillant : équipe dans la moyenne de la poule sur toutes les statistiques.</p>`:""}</div>`;
}
function fichesHTML(m){

  if(mine){ const adv=m.home===MY_TEAM?m.away:m.home; return `<h2>Fiche adversaire</h2>${ficheHTML(adv,adv===m.home?"dom":"ext")}`; }
  return `<h2>Fiches des équipes</h2>${ficheHTML(m.home,"dom")}${ficheHTML(m.away,"ext")}`;

/* ============ FICHE JOUEUR ============ */
const sheet=document.getElementById("sheet"),bg=document.getElementById("sheetBg");
function openSheet(h,top){sheet.classList.toggle("full",!!top);sheet.innerHTML=`<div class="grip"></div>`+h;sheet.classList.add("open");bg.classList.add("open");}
function closeSheet(){sheet.classList.remove("open");bg.classList.remove("open");}
bg.onclick=closeSheet;
function playerSheet(p){
  const rc=[...D.players].sort(scorerSort).indexOf(p)+1, mates=D.players.filter(x=>x.club===p.club).sort(scorerSort), rt=mates.indexOf(p)+1;
  openSheet(`<h3>${nameHTML(p.name)}</h3><p class="c">${esc(p.club)}</p><div class="stats">
    <div class="stat"><div class="num">${p.buts}</div><div class="l">Buts</div></div>
    <div class="stat"><div class="num">${fmtPct(pct(p.buts,p.tirs))}</div><div class="l">Réussite au tir (${p.tirs} tirs)</div></div>
    <div class="stat"><div class="num">${ordM(rc)}</div><div class="l">Buteur du championnat</div></div>
    <div class="stat"><div class="num">${ordM(rt)}</div><div class="l">Buteur de l'équipe</div></div>
    <div class="stat"><div class="num">${p.excl}</div><div class="l">Exclusions 2 min</div></div>
    <div class="stat"><div class="num">${fmtPct(pct(p.buts,mates.reduce((s,x)=>s+x.buts,0)))}</div><div class="l">Part des buts de l'équipe</div></div>
    ${D.hasM?`<div class="stat"><div class="num">${p.b7}</div><div class="l">Buts sur 7 m</div></div>`:""}${p.red?`<div class="stat"><div class="num">${p.red}</div><div class="l">Carton${p.red>1?"s":""} rouge${p.red>1?"s":""}</div></div>`:""}
    ${p.m?`<div class="stat"><div class="num">${p.m}</div><div class="l">Matchs joués</div></div><div class="stat"><div class="num">${fmt1(p.buts/p.m)}</div><div class="l">Buts par match</div></div>`:""}
  </div>${shotsHTML(p)}${evoPlayerHTML(p)}<p class="note">Stats individuelles hors J1 (feuille de match non détaillée).</p>`);
}

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-search]")){openSearch();return;}
  if(t.closest("[data-close]")){closeSheet();return;}
  if(t.closest("[data-refresh]")){load(true);return;}
  if(t.closest("[data-back]")){ if(depth>0){depth--;history.back();} else location.hash="#/"; return; }
  const s=t.closest("[data-seg]"); if(s){ui[s.dataset.seg]=s.dataset.v;render();return;}
  const p=t.closest("[data-player]"); if(p){playerSheet(D.players[+p.dataset.player]);return;}
  const g=t.closest("[data-go]"); if(g){ closeSheet(); if(g.dataset.go.startsWith("club/")) ui.clubTab="resume"; if(g.dataset.go.startsWith("journees")) ui.jour="";
    if(g.hasAttribute("data-rep")||g.hasAttribute("data-tab")){ if(g.hasAttribute("data-tab")){depth=0;navStack.length=0;} location.replace("#/"+g.dataset.go); } else go(g.dataset.go); return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&D&&Date.now()-D.at>5*60*1000)load(false);});

(function init(){
  const c=store.get("hand-cache");
  if(c){try{D={...build(c.raw),at:c.at,offline:true};render();}catch(e){}}
  else render();
  load(!c);
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
