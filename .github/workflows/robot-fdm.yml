name: Robot feuilles de match

# Le robot lit les feuilles de match sur le site de la fédération et remplit les deux Google Sheets (garçons et filles).
#
# GitHub ne garantit pas les tâches programmées : il en saute beaucoup et en retarde d'autres de plusieurs heures
# (samedi soir : 2 à 4 lancées sur 30 ; passage de 6 h 07 lancé vers midi). D'où la « veille » :
#  - le samedi et le dimanche, le premier lancement de la journée (passage du matin, même en retard, ou un lancement
#    de secours) met le robot en veille : un passage toutes les 10 minutes jusqu'à la fin de soirée ;
#  - un passage GitHub dure 6 h au plus : avant la limite, le robot relance lui-même la suite (mode veille-suite) ;
#  - un lancement qui arrive pendant une veille attend qu'elle se termine, puis fait un seul passage.
on:
  schedule:
    # Heures en UTC (heure de Paris moins 1 h en hiver, moins 2 h en été). Minutes décalées : l'heure pile est la plus encombrée.
    - cron: "7 5 * * *"           # tous les jours, un passage : horaires, salles, résultats (6 h 07 en hiver)
    - cron: "33 16 * * 6"         # samedi : veille jusqu'à 23 h UTC (17 h 33 à minuit en hiver)
    - cron: "33 18 * * 6"         # samedi : secours
    - cron: "33 20 * * 6"         # samedi : secours
    - cron: "3 12 * * 0"          # dimanche : veille jusqu'à 20 h UTC (13 h 03 à 21 h en hiver)
    - cron: "3 14 * * 0"          # dimanche : secours
    - cron: "3 16 * * 0"          # dimanche : secours
  workflow_dispatch:
    inputs:
      mode:
        description: "reel (un passage : remplit les journées vides), veille (passage toutes les 10 min pendant 3 h, pour un match un autre soir), controle (onglet _Import_Controle seulement), rattrapage (reel + noms officiels et joueurs manquants dans les journées déjà saisies), test-notif (notifications de test), agrandir-test puis agrandir (réservé)"
        required: true
        default: reel
        type: choice
        options: [reel, veille, controle, rattrapage, test-notif, agrandir-test, agrandir, veille-suite]

permissions:
  contents: write
  actions: write        # pour relancer la veille au bout de 6 h

# Un seul robot à la fois : un lancement qui arrive pendant une veille attend qu'elle se termine.
concurrency:
  group: robot-fdm
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot-fdm/robot/requirements.txt
      - id: deps
        run: pip install -r robot-fdm/robot/requirements.txt
      - name: Robot (garçons puis filles, en boucle les soirs de match)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NOMS_OFFICIELS: ${{ vars.NOMS_OFFICIELS || '0' }}
          # lancement manuel : mode choisi ; lancement programmé : variables du dépôt ROBOT_MODE et ROBOT_MODE_N3F
          MODE_MANUEL: ${{ github.event.inputs.mode }}
          MODE_H: ${{ vars.ROBOT_MODE || 'controle' }}
          MODE_F: ${{ vars.ROBOT_MODE_N3F || 'controle' }}
          EVENEMENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          LIMITE_MIN: ${{ vars.ROBOT_LIMITE_MIN }}
          PROGRAMME: ${{ github.event.schedule }}
        run: |
          git config user.name "robot-fdm"
          git config user.email "robot-fdm@users.noreply.github.com"
          DEBUT=$(date +%s); ECHEC=0
          # ---- veille ou passage unique ? (fin de soirée en UTC : samedi 23 h, dimanche 20 h)
          case "$(date -u +%u)" in 6) FIN_SOIR=$(date -u -d "today 23:00" +%s);; 7) FIN_SOIR=$(date -u -d "today 20:00" +%s);; *) FIN_SOIR=0;; esac
          SUITE=0
          if [ "$EVENEMENT" = "schedule" ] || [ "$MODE_MANUEL" = "veille-suite" ]; then
            FIN=$FIN_SOIR                      # en semaine : 0, donc un seul passage
            [ "$MODE_MANUEL" = "veille-suite" ] && MODE_H=reel && MODE_F=reel
          elif [ "$MODE_MANUEL" = "veille" ]; then
            FIN=$((DEBUT + 3*3600)); MODE_H=reel; MODE_F=reel
          else
            FIN=0
            if [ -n "$MODE_MANUEL" ]; then MODE_H=$MODE_MANUEL; MODE_F=$MODE_MANUEL; fi
          fi
          [ "$FIN" -le "$((DEBUT + 300))" ] && FIN=0     # soirée déjà terminée : un seul passage
          LIMITE=$((DEBUT + ${LIMITE_MIN:-3}*60))       # un passage GitHub dure 6 h au plus : on s'arrête avant...
          if [ "$FIN" -gt "$LIMITE" ]; then FIN=$LIMITE; SUITE=1; fi   # ... et on relance la suite
          [ "$FIN" -gt 0 ] && echo "Veille jusqu'à $(date -u -d @$FIN +%H:%M) UTC, un passage toutes les 10 minutes."
          n=0
          while true; do
            n=$((n+1)); T0=$(date +%s); echo "::group::Passage $n ($(date -u +%H:%M) UTC)"
            ROBOT_MODE=$MODE_H python robot-fdm/robot/robot.py robot-fdm/robot/config_honneur.json || ECHEC=1
            ROBOT_MODE=$MODE_F python robot-fdm/robot/robot.py robot-fdm/robot/config_n3f.json || ECHEC=1
            # ---- trace dans le dépôt, seulement s'il y a du nouveau (sinon un commit toutes les 10 min)
            NOUVEAU=$(grep -hv "RIEN À FAIRE" robot-fdm/robot/derniere_execution_*.txt || true)
            if [ "$FIN" -gt 0 ] && [ -z "$NOUVEAU" ] && [ -z "$(git status --porcelain -- 'robot-fdm/robot/alertes_*.txt')" ]; then
              echo "Rien de nouveau."
            else
              git add robot-fdm/robot/derniere_execution*.txt || true
              git add -- 'robot-fdm/robot/alertes_*.txt' 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -q -m "Robot : passage du $(date +%d/%m/%Y)"
                git pull -q --rebase origin main && git push -q origin HEAD:main || echo "Trace non enregistrée (sera réessayé au prochain passage)."
              fi
            fi
            echo "::endgroup::"
            # ---- passage suivant dans 10 minutes, tant que la veille n'est pas finie
            PROCHAIN=$((T0 + 600))
            if [ "$FIN" -eq 0 ] || [ "$PROCHAIN" -ge "$FIN" ]; then break; fi
            ATTENTE=$((PROCHAIN - $(date +%s))); [ "$ATTENTE" -gt 0 ] && sleep "$ATTENTE"
          done
          echo "$n passage(s)."
          if [ "$SUITE" = "1" ]; then
            echo "Limite de 6 h atteinte : relance de la veille."
            gh workflow run robot-fdm.yml --ref main -f mode=veille-suite || ECHEC=1
          fi
          exit $ECHEC
      - name: Alerte si le robot n'a pas pu démarrer
        if: failure() && steps.deps.outcome == 'failure'
        run: |
          curl -s -H "Content-Type: application/json" -d "{\"topic\":\"prhb-alerte-r7k2q\",\"title\":\"Robot : installation impossible\",\"message\":\"Le robot n'a pas pu installer ses bibliothèques Python. Relance-le depuis l'onglet Actions ; si ça recommence, voir le README.\",\"click\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" https://ntfy.sh/ || true
